[project]
name = "aivideo-whisper"
version = "0.1.0"
description = "Loopback-only faster-whisper worker for AI Video Studio"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "faster-whisper==1.2.1",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivideo_whisper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
